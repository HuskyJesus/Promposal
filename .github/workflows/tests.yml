name: Tests

# GitHub Pages publishes this repository straight from the main branch, so
# there is nothing to build or upload here, the repository root is already
# the finished site. This workflow guards it: every push runs the puzzle and
# saved-progress tests before the change goes live.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Puzzle and state tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
